<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#03050c" />
  <title>Geo Drone — Landing Mission</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23071427%27/%3E%3Ccircle cx=%2716%27 cy=%2717%27 r=%277%27 fill=%27%23eaf4ff%27/%3E%3Cpath d=%27M9 17h14%27 stroke=%27%232fd2ff%27 stroke-width=%272%27/%3E%3Cpath d=%27M4 11h6M22 11h6%27 stroke=%27%234fd8ff%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animation.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <link rel="preload" as="font" type="font/ttf" crossorigin
        href="assets/fonts/libre_baskerville/librebaskerville-variablefont_wght.ttf" />
  <!-- the HUD chrome (mission bar, tally, target chip) is set in this one -->
  <link rel="preload" as="font" type="font/ttf" crossorigin
        href="assets/fonts/poppins/poppins-extrabold.ttf" />

  <link rel="preload" as="image" href="assets/images/welcome-screen.png" />
  <link rel="preload" as="image" href="assets/images/s1-bg.png" />
  <link rel="preload" as="image" href="assets/images/s1-cockpit-2.png" />
  <link rel="preload" as="image" href="assets/images/s2-bg%20(2).png" />
  <link rel="preload" as="image" href="assets/images/drone-screen.png" />
  <link rel="preload" as="image" href="assets/images/drone.png" />
  <link rel="preload" as="image" href="assets/images/Triangle.png" />
  <link rel="preload" as="image" href="assets/images/Triangle%20spaceship.png" />
  <link rel="preload" as="image" href="assets/images/Square.png" />
  <link rel="preload" as="image" href="assets/images/Trapezium.png" />
  <link rel="preload" as="image" href="assets/images/s4-bg.png" />
</head>
<body>

<div class="stage" id="stage">

  <!-- ══════════════════════════ SCREEN 1 — COCKPIT ══════════════════════════ -->
  <section class="screen screen--cockpit is-active" id="screenCockpit">

    <!-- deep space, stretched to fill -->
    <div class="layer layer--bg s1-bg" aria-hidden="true"></div>

    <!-- drifting stars seen through the canopy -->
    <div class="starfield" id="starfield" aria-hidden="true"></div>

    <!-- the drone flies out through the canopy: sits BELOW the cockpit frame -->
    <div class="flyout" id="flyout" aria-hidden="true">
      <div class="flyout__drone" id="flyDrone">
        <span class="flyout__wash"></span>
        <img src="assets/images/drone.png" alt="" />
      </div>
      <div class="flyout__trail" id="flyTrail"></div>
    </div>

    <!-- cockpit interior, stretched to fill, painted over the window -->
    <div class="layer layer--cockpit s1-cockpit" aria-hidden="true"></div>

    <!-- ░░ dashboard readout (the yellow box) ░░ -->
    <div class="dash" id="dash">
      <canvas class="dash__wave" id="waveCanvas"></canvas>
      <div class="dash__grid" aria-hidden="true"></div>
      <div class="dash__sheen" aria-hidden="true"></div>
    </div>

    <!-- narration subtitle, read against the canopy -->
    <p class="subtitle" id="cockpitCaption" role="status" aria-live="polite"></p>

    <!-- ░░ LAUNCH button (the green box) ░░ -->
    <div class="launch-slot" id="launchSlot">
      <button class="launch" id="launchBtn" type="button" aria-label="Launch the survey drone">
        <span class="launch__ring" aria-hidden="true"></span>
        <span class="launch__body">
          <span class="launch__label">LAUNCH</span>
        </span>
      </button>
    </div>

  </section>


  <!-- ══════════════════════════ SCREEN 2 — DRONE FEED ══════════════════════════ -->
  <section class="screen screen--drone" id="screenDrone">

    <!-- ocean, faded up once the scan completes -->
    <div class="layer layer--bg s2-bg" id="oceanBg" aria-hidden="true"></div>

    <!-- the dark: sits over the ocean until the scan lands -->
    <div class="blackout" id="blackout" aria-hidden="true"></div>

    <!-- five landing zones surfacing out of the water -->
    <div class="zones" id="zones">
      <div class="zone zone--a" data-shape="triangle">
        <span class="zone__wake"></span>
        <span class="zone__ring"></span>
        <span class="zone__ring zone__ring--b"></span>
        <span class="zone__splash"></span>
        <img class="zone__img" src="assets/images/Triangle.png" alt="Large triangular landing zone" />
        <button class="zone__hit" type="button" tabindex="-1"
                aria-label="Large triangular landing zone">
          <span class="zone__pick" aria-hidden="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 13 5 5L20 7" /></svg>
          </span>
        </button>
      </div>
      <div class="zone zone--b" data-shape="square">
        <span class="zone__wake"></span>
        <span class="zone__ring"></span>
        <span class="zone__ring zone__ring--b"></span>
        <span class="zone__splash"></span>
        <img class="zone__img" src="assets/images/Square.png" alt="Square landing zone" />
        <button class="zone__hit" type="button" tabindex="-1"
                aria-label="Square landing zone">
          <span class="zone__pick" aria-hidden="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 13 5 5L20 7" /></svg>
          </span>
        </button>
      </div>
      <div class="zone zone--c" data-shape="triangle">
        <span class="zone__wake"></span>
        <span class="zone__ring"></span>
        <span class="zone__ring zone__ring--b"></span>
        <span class="zone__splash"></span>
        <img class="zone__img" src="assets/images/Triangle.png" alt="Medium triangular landing zone" />
        <button class="zone__hit" type="button" tabindex="-1"
                aria-label="Medium triangular landing zone">
          <span class="zone__pick" aria-hidden="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 13 5 5L20 7" /></svg>
          </span>
        </button>
      </div>
      <div class="zone zone--d" data-shape="trapezium">
        <span class="zone__wake"></span>
        <span class="zone__ring"></span>
        <span class="zone__ring zone__ring--b"></span>
        <span class="zone__splash"></span>
        <img class="zone__img" src="assets/images/Trapezium.png" alt="Trapezium landing zone" />
        <button class="zone__hit" type="button" tabindex="-1"
                aria-label="Trapezium landing zone">
          <span class="zone__pick" aria-hidden="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 13 5 5L20 7" /></svg>
          </span>
        </button>
      </div>
      <div class="zone zone--e" data-shape="triangle">
        <span class="zone__wake"></span>
        <span class="zone__ring"></span>
        <span class="zone__ring zone__ring--b"></span>
        <span class="zone__splash"></span>
        <img class="zone__img" src="assets/images/Triangle.png" alt="Small triangular landing zone" />
        <button class="zone__hit" type="button" tabindex="-1"
                aria-label="Small triangular landing zone">
          <span class="zone__pick" aria-hidden="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 13 5 5L20 7" /></svg>
          </span>
        </button>
      </div>
    </div>

    <!-- red scanner sweep -->
    <div class="scanner" id="scanner" aria-hidden="true">
      <div class="scanner__wash"></div>
      <div class="scanner__bar">
        <span class="scanner__core"></span>
        <span class="scanner__glow"></span>
      </div>
    </div>

    <!-- HUD frame, stretched to fill -->
    <div class="layer layer--hud drone-hud" aria-hidden="true"></div>

    <!-- ░░ narration bar — typed in step with the voice-over ░░ -->
    <header class="topbar" id="topbar">
      <div class="topbar__frame">
        <span class="topbar__badge" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 2.2c2.7 2.8 4.1 6.3 4.1 9.8v3.4H7.9V12c0-3.5 1.4-7 4.1-9.8z" />
            <path d="M7.9 12.4 5.1 15.3v3.4l2.8-2M16.1 12.4l2.8 2.9v3.4l-2.8-2" />
            <path d="M10.2 15.8c0 2.2.7 4.1 1.8 5.4 1.1-1.3 1.8-3.2 1.8-5.4z" />
            <circle cx="12" cy="9.2" r="1.7" />
          </svg>
        </span>
        <p class="topbar__text" id="topbarText" role="status" aria-live="polite"></p>
      </div>
    </header>

    <!-- ░░ the shape to match, kept on screen through the task ░░ -->
    <aside class="target" id="target" aria-hidden="true">
      <p class="target__label">SPACESHIP</p>
      <div class="target__art">
        <img src="assets/images/Triangle spaceship.png" alt="" />
      </div>
      <p class="target__name">TRIANGLE</p>
    </aside>

  </section>


  <!-- ══════════════════════════ SCREEN 3 — THE LANDING ══════════════════════════

       Geometry note: both pieces of artwork are 1254x1254 squares with a
       triangle inscribed, and the two triangles sit in almost the same
       place inside their box (measured off the alpha channel):

         Triangle spaceship.png   apex (49.9%, 2.8%)   base y 69.8%, x 4.94%..94.74%
         Triangle.png (top face)  apex (50.6%, 7.6%)   base y 70.0%, x 6%..93%

       Every number below and in landShip() comes from those two lines, which
       is what lets the ship sit exactly on a pad's painted surface instead
       of being nudged into place by eye.
       ══════════════════════════════════════════════════════════════════════ -->
  <section class="screen screen--landing" id="screenLanding">

    <!-- open water, darker than the survey feed -->
    <div class="layer layer--bg s4-bg" aria-hidden="true"></div>

    <!-- ░░ the spaceship, with its measurements called out ░░ -->
    <div class="ship" id="ship">
      <div class="ship__craft" id="shipCraft">
        <img class="ship__img" src="assets/images/Triangle spaceship.png"
             alt="Triangular spaceship, base 8 units, height 5 units" />

        <!-- Dimension overlay. The viewBox is in PERCENT OF THE SHIP BOX
             (-28..104 on both axes), and the element is placed at exactly
             those percentages, so one user unit is one percent of the ship
             and every coordinate can be read straight off the measurements
             in the comment above. -->
        <svg class="ship__dims" id="shipDims" viewBox="-28 -6 132 132" aria-hidden="true">
          <!-- perpendicular height, apex down to the middle of the base -->
          <path class="dim__inner" d="M49.9 2.8V69.8" />
          <path class="dim__square" d="M49.9 62.4H57.3V69.8" />

          <!-- height: 5 units, called out down the left -->
          <path class="dim__ext" d="M49.9 2.8H-13M4.94 69.8H-13" />
          <path class="dim__line" d="M-8 2.8V69.8" />
          <path class="dim__tip" d="M-8 2.8l-2.7 6.4h5.4zM-8 69.8l-2.7-6.4h5.4z" />
          <text class="dim__text" x="-15" y="36.3"
                transform="rotate(-90 -15 36.3)">5 units</text>

          <!-- base: 8 units, called out under the exhaust -->
          <path class="dim__ext" d="M4.94 69.8V105M94.74 69.8V105" />
          <path class="dim__line" d="M4.94 101H94.74" />
          <path class="dim__tip" d="M4.94 101l6.4-2.7v5.4zM94.74 101l-6.4-2.7v5.4z" />
          <text class="dim__text" x="49.9" y="116">8 units</text>
        </svg>
      </div>
    </div>

    <!-- ░░ the three landing pads ░░
         --k is the box width in layout units. It is 17 x sqrt(area / 20),
         so the DRAWN areas are in true proportion to the numbers printed
         on them and the 20-unit pad is exactly the size of the ship. -->
    <div class="pads" id="pads">
      <div class="pad pad--l" data-area="30">
        <img class="pad__img" src="assets/images/Triangle.png" alt="" />
        <svg class="pad__fit" viewBox="0 0 100 100" aria-hidden="true">
          <path d="M50.6 7.6 93 70H6z" />
        </svg>
        <p class="pad__area"><b>30</b><i>sq units</i></p>
        <button class="pad__hit" type="button" tabindex="-1"
                aria-label="Landing zone of 30 square units">
          <span class="pad__ring" aria-hidden="true"></span>
        </button>
      </div>

      <div class="pad pad--m" data-area="12">
        <img class="pad__img" src="assets/images/Triangle.png" alt="" />
        <svg class="pad__fit" viewBox="0 0 100 100" aria-hidden="true">
          <path d="M50.6 7.6 93 70H6z" />
        </svg>
        <p class="pad__area"><b>12</b><i>sq units</i></p>
        <button class="pad__hit" type="button" tabindex="-1"
                aria-label="Landing zone of 12 square units">
          <span class="pad__ring" aria-hidden="true"></span>
        </button>
      </div>

      <div class="pad pad--r" data-area="20">
        <img class="pad__img" src="assets/images/Triangle.png" alt="" />
        <svg class="pad__fit" viewBox="0 0 100 100" aria-hidden="true">
          <path d="M50.6 7.6 93 70H6z" />
        </svg>
        <p class="pad__area"><b>20</b><i>sq units</i></p>
        <button class="pad__hit" type="button" tabindex="-1"
                aria-label="Landing zone of 20 square units">
          <span class="pad__ring" aria-hidden="true"></span>
        </button>
      </div>
    </div>

    <!-- water thrown up where a failed landing goes in; parked by JS -->
    <div class="splash" id="splash" aria-hidden="true">
      <span class="splash__foam"></span>
      <span class="splash__ring"></span>
      <span class="splash__ring splash__ring--b"></span>
    </div>

    <!-- No HUD frame on this screen: the landing is watched from
         outside the drone feed, so the tableau sits on open water and
         the only chrome is the narration pill and the HUD lines. -->
    <div class="hud" id="landHud">
      <p class="hud__caption" id="landCaption" role="status" aria-live="polite"></p>
      <p class="hud__tally" id="landTally" role="status" aria-live="polite"></p>
    </div>

    <!-- ░░ narration bar ░░ -->
    <header class="topbar" id="landTopbar">
      <div class="topbar__frame">
        <span class="topbar__badge" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 2.2c2.7 2.8 4.1 6.3 4.1 9.8v3.4H7.9V12c0-3.5 1.4-7 4.1-9.8z" />
            <path d="M7.9 12.4 5.1 15.3v3.4l2.8-2M16.1 12.4l2.8 2.9v3.4l-2.8-2" />
            <path d="M10.2 15.8c0 2.2.7 4.1 1.8 5.4 1.1-1.3 1.8-3.2 1.8-5.4z" />
            <circle cx="12" cy="9.2" r="1.7" />
          </svg>
        </span>
        <p class="topbar__text" id="landTopbarText" role="status" aria-live="polite"></p>
      </div>
    </header>

  </section>


  <!-- ══════════════════════════ TRANSITION VEIL ══════════════════════════ -->
  <div class="veil" id="veil" aria-hidden="true">
    <span class="veil__scan"></span>
  </div>


  <!-- ══════════════════════════ SCREEN NAV ══════════════════════════ -->
  <nav class="nav" id="nav" aria-label="Screen navigation">
    <button class="nav__btn" id="navPrev" type="button" aria-label="Previous screen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" /></svg>
    </button>
    <button class="nav__btn" id="navNext" type="button" aria-label="Next screen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
    </button>
  </nav>


  <!-- ══════════════════════════ START GATE ══════════════════════════ -->
  <div class="gate" id="gate">
    <!-- the title is painted into the artwork, so the heading is
         here for the document outline and for screen readers only -->
    <h1 class="sr-only">Spacecraft Landing Mission</h1>

    <div class="gate__inner">

      <!-- The loader and the button share one grid cell, so the
           hand-off swaps them in place instead of shunting the
           title up the screen at the moment the mission is ready. -->
      <div class="gate__slot">

        <div class="gate__load" id="gateLoad">
          <div class="gate__bar">
            <span class="gate__fill" id="gateFill"></span>
            <span class="gate__sheen" aria-hidden="true"></span>
            <span class="gate__ticks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          </div>
          <p class="gate__status" role="status" aria-live="polite">
            <span class="gate__stat" id="gateStatus">Booting mission systems</span>
            <b class="gate__pct" id="gatePct">0%</b>
          </p>
        </div>

        <button class="gate__btn" id="gateBtn" type="button" hidden>
          <span>BEGIN MISSION</span>
        </button>

      </div>

    </div>
  </div>

</div>

<script src="js/lifecycle.js"></script>
<script src="js/audio.js"></script>
<script src="js/waveform.js"></script>
<script src="js/typewriter.js"></script>
<script src="js/animation.js"></script>
<script src="js/script.js"></script>
</body>
</html>
